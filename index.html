<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>깨어진 세계</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
    /* 🌌 테마: 다크-블루 심연 */
    body {
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        background: radial-gradient(circle at 50% 50%, #0d1b2a 0%, #040814 100%);
        color: #e0e1dd; display: flex; padding: 15px; user-select: none; margin: 0; height: 100vh; overflow: hidden; letter-spacing: 0.5px;
    }

    /* 🎛️ 사이드바 (UI 패널 - 좌측) */
    #sidebar {
        width: 270px; min-width: 270px; padding: 15px; background: #0b132b; border: 1px solid #1c2541; border-radius: 8px; margin-right: 15px;
        overflow-y: auto; box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8); z-index: 5000;
    }
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-thumb { background: #415a77; border-radius: 4px; }

    /* 🎛️ 퀘스트/단서 보드 (UI 패널 - 우측) */
    #right-panel {
        width: 260px; min-width: 260px; padding: 15px; background: #0b132b; border: 1px solid #1c2541; border-radius: 8px; margin-left: 15px;
        overflow-y: auto; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8); z-index: 5000;
        display: flex; flex-direction: column; gap: 12px;
    }
    #right-panel::-webkit-scrollbar { width: 6px; }
    #right-panel::-webkit-scrollbar-thumb { background: #415a77; border-radius: 4px; }

    .board-section { background: #040814; border: 1px solid #1c2541; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    .board-title { color: #00f5d4; font-size: 13px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px dashed #1c2541; padding-bottom: 6px; display: flex; align-items: center; gap: 5px; }
    
    .quest-input { width: 100%; height: 70px; background: transparent; color: #e0e1dd; border: none; resize: none; outline: none; font-family: inherit; font-size: 12px; line-height: 1.5; }
    .quest-display { font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: #e0e1dd; min-height: 70px; }
    
    /* 🌟 체크박스 퀘스트 아이템 스타일 */
    .quest-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid #1c2541; }
    .quest-item:last-child { border-bottom: none; }
    .quest-item input[type="checkbox"] { cursor: pointer; accent-color: #00f5d4; margin-top: 2px; }
    .quest-item.completed span { text-decoration: line-through; color: #415a77; }
    .del-btn { cursor: pointer; color: #ff4d4d; font-size: 11px; margin-left: auto; background: none; border: none; outline: none; padding: 0 5px; }
    .del-btn:hover { color: #ff9f1c; }
    .add-quest-box { display: flex; gap: 5px; margin-top: 8px; border-top: 1px dashed #1c2541; padding-top: 8px; }
    .quest-input-field { flex: 1; background: #0b132b; border: 1px solid #415a77; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; outline: none; }
    
    .clue-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; min-height: 150px; }
    .clue-list::-webkit-scrollbar { width: 4px; }
    .clue-list::-webkit-scrollbar-thumb { background: #415a77; }
    
    .clue-item { background: #1b263b; margin-bottom: 6px; padding: 8px; border-radius: 4px; border-left: 3px solid #00f5d4; font-size: 11px; line-height: 1.4; color: #e0e1dd; word-break: keep-all; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
    .clue-item b { color: #7fb3d5; margin-right: 5px; }
    .clue-item.marker-item { border-left-color: #ff9f1c; background: #141b2d; }

    h1 { font-size: 18px; color: #778da9; text-align: center; margin-bottom: 15px; font-weight: 600; border-bottom: 1px solid #1c2541; padding-bottom: 10px; }
    h3 { font-size: 12px; margin-bottom: 8px; color: #778da9; font-weight: bold; margin-top: 15px; }
    
    .btn { display: block; width: 100%; padding: 8px; box-sizing: border-box; background: #1b263b; border: 1px solid #415a77; color: #e0e1dd; border-radius: 4px; cursor: pointer; margin-bottom: 6px; font-size: 12px; text-align: center; transition: all 0.2s; }
    .btn:hover { background: #415a77; color: #fff;}
    
    /* 🌟 버튼 그리드 스타일 */
    .system-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 15px; }
    .system-grid .btn { margin-bottom: 0; font-weight: bold; }
    
    .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
    .tool-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 10px; }
    
    .tool-grid .btn, .tool-grid-2 .btn { 
        margin-bottom: 0; 
        padding: 6px 2px; 
        font-size: 11px; 
        line-height: 1.2;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        text-align: center; 
        word-break: keep-all; 
    }

    .tool-btn.active-tool { background: #3e5c76 !important; border-color: #00f5d4 !important; color: #fff !important; box-shadow: inset 0 0 0 2px #00f5d4; }
    
    .toggle-container { display: flex; background: #080c16; padding: 4px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #1c2541; }
    .toggle-btn { flex: 1; padding: 6px; background: transparent; color: #778da9; border: none; cursor: pointer; font-size: 11px; border-radius: 3px; transition: 0.2s; font-weight: bold; }
    .toggle-btn.active, .toggle-btn.gimmick-type-active { background: #415a77; color: #fff; }
    .toggle-btn.prop-on { color: #00f5d4; }
    .toggle-btn.prop-off { color: #415a77; text-decoration: line-through; }

    .input-field { width: 100%; padding: 6px; box-sizing: border-box; background: #040814; border: 1px solid #415a77; color: #fff; border-radius: 4px; margin-bottom: 10px; font-size:11px; }

    /* 🎯 좌표계 (9x9) - 캡처 여백 방지를 위해 컨텐츠 크기에 맞춤 설정 */
    .coord-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(11, 19, 43, 0.7); 
        padding: 10px; border-radius: 8px; border: 1px solid #1c2541; position: relative; overflow: auto;
        width: max-content; height: max-content; margin: auto;
    }
    .col-labels { display: flex; margin-left: 40px; margin-bottom: 10px; }
    .col-label { width: 62px; text-align: center; margin-right: 4px; color: #778da9; font-size: 14px; font-weight: bold; }
    .col-label:last-child { margin-right: 0; }
    
    .board-body { display: flex; align-items: flex-start; }
    .row-labels { display: flex; flex-direction: column; margin-right: 10px; }
    .row-label { height: 62px; width: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; color: #778da9; font-size: 14px; font-weight: bold; }
    .row-label:last-child { margin-bottom: 0; }

    #game-container { position: relative; width: max-content; height: max-content; outline: none; }
    #game-board { display: grid; grid-template-columns: repeat(9, 62px); grid-template-rows: repeat(9, 62px); gap: 4px; }

    /* 🧩 블럭 */
    .block {
        width: 62px; height: 62px; background-color: #1b263b; position: relative; cursor: pointer; box-sizing: border-box;
        display: grid; grid-template-columns: repeat(3, 20px); grid-template-rows: repeat(3, 20px);
        border: 1px solid #415a77; border-radius: 2px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    .block.empty-block { background-color: #040814; border: 1px dashed #1c2541; box-shadow: none; }
    .block.wall-block { background-color: #0b132b; border-color: #040814; background-image: repeating-linear-gradient(45deg, #1c2541 25%, transparent 25%, transparent 75%, #1c2541 75%, #1c2541); background-size: 8px 8px; cursor: not-allowed; }
    
    .block.selected-block::after { content: ''; position: absolute; inset: -3px; border: 3px solid #00b4d8; box-shadow: 0 0 15px rgba(0, 180, 216, 0.6); z-index: 100; pointer-events: none; }
    .block.highlight::after { content: ''; position: absolute; inset: -2px; background-color: rgba(0, 245, 212, 0.15); border: 2px solid #00f5d4; z-index: 100; pointer-events: none; }
    
    .constraint-icon { position: absolute; font-size: 10px; font-weight: bold; z-index: 15; color: #fff; background: rgba(0,0,0,0.8); padding: 2px 4px; border-radius: 2px; pointer-events: none; }
    .constraint-icon.no-move { bottom: 2px; left: 2px; color: #ff4d4d; border: 1px solid #ff4d4d; } 
    .constraint-icon.no-rot { bottom: 2px; right: 2px; color: #ffb703; border: 1px solid #ffb703; } 

    .tile { width: 20px; height: 20px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; position: relative; box-sizing: border-box; }
    .path { background-color: #4a6fa5; }
    .start-point .path { background-color: #3a86ff; }
    .goal-point .path { background-color: #38b000; }
    
    /* 1x1 타일 상태 스타일 (벽, 물, 발판) */
    .tile-wall { background-color: #0b132b !important; background-image: repeating-linear-gradient(45deg, #1c2541 25%, transparent 25%, transparent 75%, #1c2541 75%, #1c2541) !important; background-size: 6px 6px !important; box-shadow: inset 0 0 2px #000 !important; cursor: not-allowed; }
    .tile-water-low { background-color: #2c3e50 !important; box-shadow: inset 0 0 5px rgba(0,0,0,0.5) !important; }
    .tile-water-high { background-color: #3498db !important; box-shadow: inset 0 0 10px rgba(52,152,219,0.5) !important; }
    .tile-plat-low { background-color: #0b132b !important; border: 1px dashed #778da9 !important; box-shadow: none !important;}
    .tile-plat-high { background-color: #8b4513 !important; box-shadow: inset 0 0 5px rgba(0,0,0,0.8) !important; }

    /* 🌫️ 안개 */
    .fog { position: absolute; inset: -1px; background-color: rgba(4, 8, 20, 0.6); z-index: 40; pointer-events: none; border: 1px solid #000; border-radius: 2px; }
    .capture-PL .fog, .preview-fog .fog { opacity: 1 !important; z-index: 99 !important; background-color: #040814 !important; border: 1px solid #1c2541 !important;}

    #world-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    #clue-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 105; } 
    
    .overlay-item { position: absolute; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; transition: top 0.15s ease, left 0.15s ease; pointer-events: none; }
    
    .gimmick-a::after { content: ''; position: absolute; inset: 0; background-color: rgba(0,0,0,0.4); pointer-events: none; z-index: 5; }
    .gimmick-b { filter: drop-shadow(0 0 3px rgba(255,255,255,0.4)); }
    
    .symbol-icon { font-size: 16px; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,255,0.5); pointer-events: auto; z-index: 10; position: relative; }
    .symbol-item { color: #fdf0d5; }
    .symbol-rock { color: #a2a8d3; }
    .symbol-waterfall { color: #8ecae6; }
    .symbol-warp { color: #c77dff; }
    .symbol-enemy { color: #ff4d4d; }
    .symbol-hole { color: #111; text-shadow: 0 0 2px #fff; }
    .symbol-switch { color: #e74c3c; }

    .player-marker { display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
    
    legend { font-size: 11px; color: #778da9; margin-top: 15px; line-height: 1.6; padding: 10px; border-top: 1px solid #1c2541; }
    #tooltip { position: absolute; display: none; background: #0b132b; color: #00f5d4; border: 1px solid #415a77; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 9999; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }

    /* 🪟 GM 플로팅 윈도우 스타일 */
    .gm-modal { position: absolute; display: none; background: #0b132b; border: 1px solid #415a77; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); z-index: 10000; width: 280px; resize: both; overflow: hidden; }
    .gm-modal-header { background: #1c2541; padding: 10px; font-size: 14px; font-weight: bold; color: #00f5d4; cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #415a77; }
    .gm-modal-close { cursor: pointer; color: #ff4d4d; font-size: 16px; line-height: 1; padding: 0 5px; }
    .gm-modal-close:hover { color: #ff9f1c; }
    .gm-modal-body { padding: 15px; }
    #gm-memo-area { width: 100%; height: 200px; background: #040814; color: #e0e1dd; border: 1px solid #415a77; border-radius: 4px; padding: 8px; box-sizing: border-box; resize: vertical; }
    .timer-display { font-size: 40px; font-weight: bold; text-align: center; color: #00f5d4; text-shadow: 0 0 10px rgba(0,245,212,0.5); letter-spacing: 2px; margin: 15px 0; }
    .timer-display.alert { color: #ff4d4d; text-shadow: 0 0 15px rgba(255,77,77,0.8); animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .timer-inputs { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
    .timer-input { width: 50px; background: #040814; color: #fff; border: 1px solid #415a77; text-align: center; border-radius: 4px; padding: 5px; }
    .timer-btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .dice-result { font-size: 32px; font-weight: bold; text-align: center; margin: 20px 0; color: #f1c40f; text-shadow: 0 0 10px rgba(241,196,15,0.6); }
    .dice-log { font-size: 12px; color: #778da9; max-height: 80px; overflow-y: auto; border-top: 1px solid #1c2541; padding-top: 10px; margin-top: 10px; }
</style>
</head>
<body>

<div id="tooltip"></div>

<!-- GM 모달들 -->
<div id="modal-notepad" class="gm-modal" style="left: 350px; top: 50px;">
    <div class="gm-modal-header">📝 시크릿 메모장 <span class="gm-modal-close" onclick="closeModal('modal-notepad')">✖</span></div>
    <div class="gm-modal-body"><textarea id="gm-memo-area" placeholder="마스터 전용 메모장입니다."></textarea></div>
</div>
<div id="modal-timer" class="gm-modal" style="left: 650px; top: 50px; width: 260px;">
    <div class="gm-modal-header">⏱️ 라운드 & 타이머 <span class="gm-modal-close" onclick="closeModal('modal-timer')">✖</span></div>
    <div class="gm-modal-body">
        <div style="display:flex; justify-content:space-between; align-items:center; background:#040814; padding:10px; border-radius:4px; border:1px solid #415a77;">
            <button class="btn" style="width:30px; padding:5px; margin:0;" onclick="changeRound(-1)">-</button>
            <div style="font-size:18px; font-weight:bold; color:#fff;">라운드: <span id="round-counter">1</span></div>
            <button class="btn" style="width:30px; padding:5px; margin:0;" onclick="changeRound(1)">+</button>
        </div>
        <div id="timer-display" class="timer-display">00:00</div>
        <div class="timer-inputs">
            <input type="number" id="t-min" class="timer-input" placeholder="분" min="0" max="99">
            <span style="color:#778da9; align-self:center;">:</span>
            <input type="number" id="t-sec" class="timer-input" placeholder="초" min="0" max="59">
        </div>
        <div class="timer-btn-group">
            <button class="btn" onclick="startTimer()" style="margin:0; background:#27ae60; border-color:#2ecc71;">시작</button>
            <button class="btn" onclick="pauseTimer()" style="margin:0; background:#d35400; border-color:#e67e22;">일시정지</button>
            <button class="btn" onclick="resetTimer()" style="margin:0; background:#c0392b; border-color:#e74c3c;">초기화</button>
        </div>
    </div>
</div>
<div id="modal-dice" class="gm-modal" style="left: 930px; top: 50px; width: 220px;">
    <div class="gm-modal-header">🎲 다이스타워 <span class="gm-modal-close" onclick="closeModal('modal-dice')">✖</span></div>
    <div class="gm-modal-body">
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <button class="btn" style="margin:0;" onclick="rollDice(20)">1d20</button>
            <button class="btn" style="margin:0;" onclick="rollDice(100)">1d100</button>
            <button class="btn" style="margin:0;" onclick="rollDice(6)">1d6</button>
        </div>
        <div id="dice-result" class="dice-result">-</div>
        <div id="dice-log" class="dice-log"></div>
    </div>
</div>

<!-- 🎛️ 좌측 패널 -->
<div id="sidebar">
    <h1>Distortion World</h1>

    <div class="system-grid">
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 맵 열기</button>
        <input type="file" id="file-input" style="display: none;" accept=".json" onchange="loadMap(event)">
        <button class="btn" onclick="saveMap()">💾 맵 저장</button>
        <button class="btn" onclick="copyMapImage('GM')">📸 GM 캡처</button>
        <button class="btn" onclick="copyMapImage('PL')">📸 PL 캡처</button>
        
        <button id="btn-block-asset" class="btn" style="grid-column: span 2; background:#8e44ad; border-color:#9b59b6; font-weight:bold; box-shadow: 0 0 10px rgba(142,68,173,0.5);" onclick="document.getElementById('block-asset-input').click()">🧱 길블럭 에셋 ZIP 적용</button>
        <input type="file" id="block-asset-input" style="display: none;" accept=".zip, image/*" multiple onchange="loadBlockAssets(event)">
        
        <button id="btn-player-asset" class="btn" style="grid-column: span 2; background:#d35400; border-color:#e67e22; font-weight:bold; box-shadow: 0 0 10px rgba(211,84,0,0.5);" onclick="document.getElementById('player-asset-input').click()">🧍 플레이어 에셋 ZIP 적용</button>
        <input type="file" id="player-asset-input" style="display: none;" accept=".zip, image/*" multiple onchange="loadPlayerAssets(event)">
    </div>

    <div style="display: flex; align-items: center; margin-bottom: 15px;">
        <div style="flex: 2; display: flex; gap: 5px;">
            <button class="btn" style="margin: 0; padding: 10px 0;" onclick="changeFloor(1)">▲ 위층</button>
            <button class="btn" style="margin: 0; padding: 10px 0;" onclick="changeFloor(-1)">▼ 아래층</button>
        </div>
        <div id="floor-info" style="flex: 1; font-size: 24px; color: #00f5d4; font-weight: bold; text-align: right; text-shadow: 0 0 10px rgba(0,245,212,0.5);">1F</div>
    </div>

    <div class="toggle-container">
        <button id="mode-edit" class="toggle-btn active" onclick="setMode('edit')">설계(GM)</button>
        <button id="mode-play" class="toggle-btn" onclick="setMode('play')">탐험(PL)</button>
    </div>

    <!-- 🛠️ GM 설계 모드 -->
    <div id="edit-tools">
        <h3>블럭 속성 (3x3 전체)</h3>
        <div class="toggle-container" style="margin-bottom: 8px;">
            <button id="brush-move-btn" class="toggle-btn prop-on" onclick="toggleBrushConstraint('move')">이동 가능</button>
            <button id="brush-rot-btn" class="toggle-btn prop-on" onclick="toggleBrushConstraint('rotate')">회전 가능</button>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; background:#080c16; padding:8px; border: 1px solid #1c2541; border-radius:4px;">
            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                <span style="font-size:11px; color:#778da9; margin-bottom:6px;">회전 방향: <b id="brush-rot-text" style="color:#00f5d4;">0도</b></span>
                <button class="btn" style="width:auto; margin:0; padding:5px 10px; font-size:11px;" onclick="rotateBrush()">90도 회전</button>
            </div>
            <div id="mini-preview" class="block" style="width: 56px; height: 56px; display:grid; grid-template-columns: repeat(3, 18px); grid-template-rows: repeat(3, 18px); pointer-events: none;"></div>
        </div>

        <div class="tool-grid">
            <button id="btn-cross" class="btn tool-btn active-tool" onclick="selectEditTool(this, 'shape', 'cross')">십자 (+)</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'straight')">일자 (|)</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'corner')">꺾은선 (ㄱ)</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'tshape')">외길 (ㅓ)</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'dot')">징검다리</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'empty')">블럭 삭제</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'start')" style="color:#7fb3d5;">시작블럭</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'goal')" style="color:#82e0aa;">목표블럭</button>
            <button class="btn tool-btn" onclick="selectEditTool(this, 'shape', 'wall')" style="color:#777;">장애물벽</button>
        </div>

        <h3>타일 세부 설정 (1x1 격자)</h3>
        <div class="tool-grid">
            <button class="btn tool-btn" onclick="selectEditTool(this, 'tile', 1)">🧱 타일 벽</button>

<script>

    };

    let playerFacing = '아래'; 
    const pressedKeys = {};

        empty:    { tiles: [0,0,0, 0,0,0, 0,0,0] },
        wall:     { tiles: [0,0,0, 0,0,0, 0,0,0] },
        cross:    { tiles: [0,1,0, 1,1,1, 0,1,0] },
        straight: { tiles: [0,1,0, 0,1,0, 0,1,0] },
        corner:   { tiles: [0,0,0, 0,1,1, 0,1,0] },
        tshape:   { tiles: [0,1,0, 1,1,0, 0,1,0] },
        dot:      { tiles: [0,0,0, 0,1,0, 0,0,0] },
        start:    { tiles: [0,1,0, 1,1,1, 0,1,0] },
        goal:     { tiles: [0,1,0, 1,1,1, 0,1,0] }
    };
    
    const gimmickVisuals = { 
        item: { icon: '◆', class: 'symbol-item' }, 
        rock: { icon: '■', class: 'symbol-rock' }, 
        waterfall: { icon: '⇈', class: 'symbol-waterfall' },
        warphole: { icon: '◎', class: 'symbol-warp' },
        enemy: { icon: '☠', class: 'symbol-enemy' },
        hole: { icon: '🕳️', class: 'symbol-hole' },
        switch: { icon: '🕹️', class: 'symbol-switch' }
    };

    let mapData, worldGimmickData, worldMarkerData, worldClueData; 

    function createEmptyMap() {
        mapData = Array.from({length: MAX_FLOORS}, () => 
            Array.from({length: GRID_SIZE}, () => 
                Array.from({length: GRID_SIZE}, () => ({
                    type: 'empty', rotation: 0, revealed: false, isMovable: true, isRotatable: true,
                    gimmicks: Array(9).fill(null), markers: Array(9).fill(null), blockClue: null,
                    tileStates: Array(9).fill(0) 
                }))
            )
        );
        worldGimmickData = Array.from({length: MAX_FLOORS}, () => Array.from({length: 27}, () => Array(27).fill(null)));
        worldMarkerData = Array.from({length: MAX_FLOORS}, () => Array.from({length: 27}, () => Array(27).fill(null)));
        worldClueData = Array.from({length: MAX_FLOORS}, () => Array.from({length: 27}, () => Array(27).fill(null)));
        
        playerSpawns = Array(MAX_FLOORS).fill(null);
        playerPositions = Array(MAX_FLOORS).fill(null);
        
        floorQuests = Array(MAX_FLOORS).fill(null).map(() => []); 
        floorHints = Array(MAX_FLOORS).fill("");
        globalWaterLevel = false;
    }
    createEmptyMap();

    const boardEl = document.getElementById('game-board');
    const overlayEl = document.getElementById('world-overlay');
    const clueOverlayEl = document.getElementById('clue-overlay'); 
    const containerEl = document.getElementById('game-container');
    const tooltipEl = document.getElementById('tooltip');

    function getFlagSVG(color, isFlipped) {
        const transform = isFlipped ? `transform="scale(-1, 1) translate(-24, 0)"` : '';
        return `<svg viewBox="0 0 24 24" width="16" height="16" style="filter: drop-shadow(0 0 2px #000);"><path ${transform} fill="${color}" d="M4 2v20h2v-6h14l-4-5 4-5H6V2z"/></svg>`;
    }
    
    function getPlayerMarkerSVG() {
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="#c42A12" style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));">
            <circle cx="12" cy="8.5" r="3.5"/>
            <polygon points="12,21 16,14 8,14"/>
        </svg>`;
    }

    document.addEventListener('mousemove', (e) => {
        if (e.target.dataset.memo) {
            tooltipEl.innerText = e.target.dataset.memo;
            tooltipEl.style.display = 'block';
            tooltipEl.style.left = e.pageX + 15 + 'px'; tooltipEl.style.top = e.pageY + 15 + 'px';
        } else {
            tooltipEl.style.display = 'none';
        }
    });

    async function loadBlockAssets(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        let loadedCount = 0;
        for (let file of files) {
            if (file.name.toLowerCase().endsWith('.zip')) {
                try {
                    const zip = new JSZip();
                    const loadedZip = await zip.loadAsync(file);
                    for (const [filename, zipEntry] of Object.entries(loadedZip.files)) {
                        if (!zipEntry.dir && filename.match(/\.(png|jpg|jpeg|gif|webp)$/i)) {
                            const blob = await zipEntry.async("blob");
                            const url = URL.createObjectURL(blob);
                            const name = filename.split('/').pop().split('.')[0]; 
                            applyBlockAssetToStorage(name, url);
                            loadedCount++;
                        }
                    }
                } catch (err) { alert("ZIP 파일을 읽는 중 오류가 발생했습니다."); }
            } else if (file.type.startsWith('image/')) {
                const url = URL.createObjectURL(file);
                const name = file.name.split('.')[0];
                applyBlockAssetToStorage(name, url);
                loadedCount++;
            }
        }
        if (loadedCount > 0) { alert(`총 ${loadedCount}개의 길블럭 에셋이 성공적으로 적용되었습니다!`); renderMap(); }
        e.target.value = '';
    }

    async function loadPlayerAssets(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        let loadedCount = 0;
        for (let file of files) {
            if (file.name.toLowerCase().endsWith('.zip')) {
                try {
                    const zip = new JSZip();
                    const loadedZip = await zip.loadAsync(file);
                    for (const [filename, zipEntry] of Object.entries(loadedZip.files)) {
                        if (!zipEntry.dir && filename.match(/\.(png|jpg|jpeg|gif|webp)$/i)) {
                            const blob = await zipEntry.async("blob");
                            const url = URL.createObjectURL(blob);
                            const name = filename.split('/').pop().split('.')[0]; 
                            applyPlayerAssetToStorage(name, url);
                            loadedCount++;
                        }
                    }
                } catch (err) { alert("ZIP 파일을 읽는 중 오류가 발생했습니다."); }
            } else if (file.type.startsWith('image/')) {
                const url = URL.createObjectURL(file);
                const name = file.name.split('.')[0];
                applyPlayerAssetToStorage(name, url);
                loadedCount++;
            }
        }
        if (loadedCount > 0) { alert(`총 ${loadedCount}개의 플레이어 에셋이 성공적으로 적용되었습니다!`); renderMap(); }
        e.target.value = '';
    }

    function applyBlockAssetToStorage(name, url) {
        if (name.includes('십자') || name.toLowerCase().includes('cross')) customAssets.blocks.cross = url;
        if (name.includes('일자') || name.toLowerCase().includes('straight')) customAssets.blocks.straight = url;
        if (name.includes('꺾은선') || name.toLowerCase().includes('corner')) customAssets.blocks.corner = url;
        if (name.includes('외길') || name.toLowerCase().includes('tshape')) customAssets.blocks.tshape = url;
        if (name.includes('징검다리') || name.toLowerCase().includes('dot')) customAssets.blocks.dot = url;
        if (name.includes('시작') || name.toLowerCase().includes('start')) customAssets.blocks.start = url;
        if (name.includes('목표') || name.toLowerCase().includes('goal')) customAssets.blocks.goal = url;
        if (name.includes('벽') || name.toLowerCase().includes('wall')) customAssets.blocks.wall = url;
    }

    function applyPlayerAssetToStorage(name, url) {
        if (name.endsWith('_위') || name === '위' || name.endsWith('_뒤') || name === '뒤') customAssets.player['위'] = url;
        else if (name.endsWith('_아래') || name === '아래' || name.endsWith('_앞') || name === '앞') customAssets.player['아래'] = url;
        else if (name.endsWith('_왼쪽') || name === '왼쪽') customAssets.player['왼쪽'] = url;
        else if (name.endsWith('_오른쪽') || name === '오른쪽') customAssets.player['오른쪽'] = url;
    }

    function toggleGMMenu() {
        const menu = document.getElementById('gm-tools-menu');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function openModal(modalId) { document.getElementById(modalId).style.display = 'block'; bringToFront(document.getElementById(modalId)); }
    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
    function makeDraggable(element) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0; const header = element.querySelector('.gm-modal-header');
        element.onmousedown = function() { bringToFront(element); };
        if (header) { header.onmousedown = dragMouseDown; }
        function dragMouseDown(e) { e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
        function elementDrag(e) { e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; element.style.top = (element.offsetTop - pos2) + "px"; element.style.left = (element.offsetLeft - pos1) + "px"; }
        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
    }
    let highestZ = 10000; function bringToFront(element) { highestZ++; element.style.zIndex = highestZ; }
    makeDraggable(document.getElementById('modal-notepad')); makeDraggable(document.getElementById('modal-timer')); makeDraggable(document.getElementById('modal-dice'));

    let currentRound = 1; function changeRound(amount) { currentRound = Math.max(1, currentRound + amount); document.getElementById('round-counter').innerText = currentRound; }
    let timerInterval = null, timeRemaining = 0; const timerDisplay = document.getElementById('timer-display'), inputMin = document.getElementById('t-min'), inputSec = document.getElementById('t-sec');
    function updateTimerDisplay() { const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0'); const s = (timeRemaining % 60).toString().padStart(2, '0'); timerDisplay.innerText = `${m}:${s}`; if(timeRemaining === 0) timerDisplay.classList.add('alert'); else timerDisplay.classList.remove('alert'); }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerDisplay.classList.remove('alert'); if(inputMin.value !== "" || inputSec.value !== "") { timeRemaining = parseInt(inputMin.value || 0) * 60 + parseInt(inputSec.value || 0); inputMin.value = ""; inputSec.value = ""; } if(timeRemaining <= 0) return; updateTimerDisplay(); timerInterval = setInterval(() => { timeRemaining--; updateTimerDisplay(); if(timeRemaining <= 0) clearInterval(timerInterval); }, 1000); }
    function pauseTimer() { if(timerInterval) clearInterval(timerInterval); }
    function resetTimer() { pauseTimer(); timeRemaining = 0; updateTimerDisplay(); timerDisplay.classList.remove('alert'); }
    function rollDice(max) { const result = Math.floor(Math.random() * max) + 1; document.getElementById('dice-result').innerText = result; const log = document.getElementById('dice-log'); const entry = document.createElement('div'); entry.innerText = `▶ 1d${max} = ${result}`; log.prepend(entry); }

    function toggleLanternMode() { lanternMode = !lanternMode; const btn = document.getElementById('btn-lantern'); btn.classList.toggle('gimmick-type-active', lanternMode); btn.innerText = `🏮 등불: ${lanternMode ? 'ON' : 'OFF'}`; renderMap(); }
    function toggleGimmickBlindMode() { gimmickBlindMode = !gimmickBlindMode; const btn = document.getElementById('btn-gimmick-blind'); btn.classList.toggle('gimmick-type-active', gimmickBlindMode); btn.innerText = `❓ 블라인드: ${gimmickBlindMode ? 'ON' : 'OFF'}`; renderMap(); }
    function toggleGMFog() { if (currentMode === 'play') { gmFogPreview = !gmFogPreview; const btn = document.getElementById('btn-fog-preview'); if(gmFogPreview) { document.body.classList.add('preview-fog'); btn.classList.add('gimmick-type-active'); } else { document.body.classList.remove('preview-fog'); btn.classList.remove('gimmick-type-active'); } btn.innerText = `👁️ PL 시야 (미리보기): ${gmFogPreview ? 'ON' : 'OFF'}`; renderMap(); } }

        const saveData = { mapData, worldGimmickData, worldMarkerData, worldClueData, currentFloor, playerSpawns, playerPositions, floorQuests, floorHints, globalWaterLevel };
        const blob = new Blob([JSON.stringify(saveData)], { type: "application/json" });

    function loadMap(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const loaded = JSON.parse(event.target.result);
                mapData = loaded.mapData; worldGimmickData = loaded.worldGimmickData; worldMarkerData = loaded.worldMarkerData; currentFloor = loaded.currentFloor;
                worldClueData = loaded.worldClueData || Array.from({length: MAX_FLOORS}, () => Array.from({length: 27}, () => Array(27).fill(null)));
                playerSpawns = loaded.playerSpawns || Array(MAX_FLOORS).fill(null); playerPositions = loaded.playerPositions || Array(MAX_FLOORS).fill(null);
                
                mapData.forEach(f => f.forEach(r => r.forEach(b => { if(!b.tileStates) b.tileStates = Array(9).fill(0); })));
                globalWaterLevel = loaded.globalWaterLevel || false;
                const waterBtn = document.getElementById('btn-water-level');
                if(waterBtn) waterBtn.innerText = `🌊 수위 연동: ${globalWaterLevel ? '높음 (침수)' : '낮음'} (GM전용)`;

                const loadedQuests = loaded.floorQuests || Array(MAX_FLOORS).fill(null).map(() => []);
                floorQuests = loadedQuests.map(qList => { if (Array.isArray(qList)) return qList; return qList ? [{text: qList, completed: false}] : []; });
                
                floorHints = loaded.floorHints || Array(MAX_FLOORS).fill("");
                updateFloorUI(); if (currentMode === 'play') playerPos = playerPositions[currentFloor]; renderMap();
            } catch(err) { console.error(err); } e.target.value = ''; 
        }; reader.readAsText(file);
    }

    async function copyMapImage(copyMode) {
        const prevMode = currentMode;
        if (copyMode === 'GM') setMode('edit'); else if (copyMode === 'PL') { isCapturingPL = true; setMode('play'); }
        document.body.classList.add(`capture-${copyMode}`); renderMap(); 
        
        const target = document.getElementById('capture-target');
        
        // 🌟 html2canvas 캡처 시 스크롤 잘림 현상 방지를 위해 임시 스타일 조정
        const oldOverflow = target.style.overflow;
        target.style.overflow = 'visible'; 
        
        try {
            const canvas = await html2canvas(target, { backgroundColor: '#0b132b', scale: 2 });
            canvas.toBlob(async (blob) => { try { const item = new ClipboardItem({ "image/png": blob }); await navigator.clipboard.write([item]); alert('해당 맵이 성공적으로 클립보드에 복사되었습니다.'); } catch (err) { alert('클립보드 복사 중 오류가 발생했습니다.'); } });
        } catch (err) {} finally { 
            target.style.overflow = oldOverflow;
            document.body.classList.remove(`capture-${copyMode}`); if (copyMode === 'PL') isCapturingPL = false; setMode(prevMode); renderMap(); 
        }
    }

    function getOriginalTileCoord(vx, vy, rotation) {
        let r = rotation % 360; if (r < 0) r += 360;
        if (r === 0) return {x: vx, y: vy}; if (r === 90) return {x: vy, y: 2 - vx}; if (r === 180) return {x: 2 - vx, y: 2 - vy}; if (r === 270) return {x: 2 - vy, y: vx};
    }

    function updateBrushPreview() {
        document.getElementById('brush-rot-text').innerText = brushRotation + '도'; const previewEl = document.getElementById('mini-preview'); previewEl.innerHTML = '';
        let layout = blockTypes[currentEditTool] ? blockTypes[currentEditTool].tiles : Array(9).fill(0); if (currentEditCategory !== 'shape') layout = blockTypes['cross'].tiles; 
        if (currentEditTool === 'empty') { previewEl.style.backgroundColor = '#040814'; previewEl.style.border = '1px dashed #1c2541'; } else if (currentEditTool === 'wall') { previewEl.style.backgroundColor = '#0b132b'; } else { previewEl.style.backgroundColor = '#1b263b'; previewEl.style.border = '1px solid #415a77'; }
        for(let i=0; i<9; i++) { const vx = i % 3, vy = Math.floor(i / 3); const orig = getOriginalTileCoord(vx, vy, brushRotation); const t = document.createElement('div'); t.style.width = '18px'; t.style.height = '18px'; t.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,0.2)'; if(layout[orig.y * 3 + orig.x] && currentEditTool !== 'wall') t.style.backgroundColor = '#4a6fa5'; previewEl.appendChild(t); }
    }

    function rotateBrush() { brushRotation = (brushRotation + 90) % 360; updateBrushPreview(); }
    
    function updateFloorUI() { 
        document.getElementById('floor-info').innerText = floorNames[currentFloor];

    function setMode(mode) {

            gmFogPreview = false; document.body.classList.remove('preview-fog');

    function selectEditTool(btnEl, category, tool) {
        currentEditCategory = category; currentEditTool = tool;
        document.querySelectorAll('#edit-tools .tool-btn').forEach(btn => btn.classList.remove('active-tool'));
        if(btnEl) btnEl.classList.add('active-tool'); updateBrushPreview();
    }
    function selectPlayTool(btnEl, tool) { playTool = tool; document.querySelectorAll('#play-tools .tool-btn').forEach(btn => btn.classList.remove('active-tool')); if(btnEl) btnEl.classList.add('active-tool'); }
    function setGimmickBinding(type) { gimmickBinding = type; document.getElementById('bind-a').className = `toggle-btn ${type === 'A' ? 'gimmick-type-active' : ''}`; document.getElementById('bind-b').className = `toggle-btn ${type === 'B' ? 'gimmick-type-active' : ''}`; }

    function handleRightClickBlockMove(bx, by) {
        const targetBlock = mapData[currentFloor][by][bx]; if (targetBlock.type === 'empty' || targetBlock.type === 'wall' || !targetBlock.isMovable) { selectedBlockForMove = null; highlightedBlocks = []; renderMap(); return; }
        selectedBlockForMove = { x: bx, y: by }; highlightedBlocks = [];
        const directions = [[0, -1], [0, 1], [-1, 0], [1, 0]]; 
        for (let d of directions) { let nx = bx + d[0], ny = by + d[1]; while (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) { if (mapData[currentFloor][ny][nx].type === 'empty') { highlightedBlocks.push({ x: nx, y: ny }); nx += d[0]; ny += d[1]; } else break; } }
        renderMap();
    }

    function handleTileClick(bx, by, domIndex) {
        const block = mapData[currentFloor][by][bx];
        const vx = domIndex % 3; const vy = Math.floor(domIndex / 3);
        const orig = getOriginalTileCoord(vx, vy, block.rotation); const origIndex = orig.y * 3 + orig.x;

        if (currentMode === 'edit') {
            if (currentEditCategory === 'system') {
                if (currentEditTool === 'spawn') { if (block.type === 'empty' || block.type === 'wall') return; playerSpawns[currentFloor] = { wx: bx * 3 + vx, wy: by * 3 + vy }; playerPositions[currentFloor] = null; }
            } 
            else if (currentEditCategory === 'shape') {
                block.type = currentEditTool; block.rotation = brushRotation; block.isMovable = brushMovable; block.isRotatable = brushRotatable;
                if (currentEditTool === 'empty' || currentEditTool === 'wall') { block.gimmicks = Array(9).fill(null); block.markers = Array(9).fill(null); block.isMovable = false; block.isRotatable = false; block.tileStates = Array(9).fill(0); }
            } 
            else if (currentEditCategory === 'tile') {
                if (block.type === 'empty' || block.type === 'wall') return;
                if (!block.tileStates) block.tileStates = Array(9).fill(0);
                block.tileStates[origIndex] = currentEditTool;
            }
            else if (currentEditCategory === 'gimmick') {
                if (currentEditTool === 'delete') { block.gimmicks[origIndex] = null; worldGimmickData[currentFloor][by*3 + vy][bx*3 + vx] = null; } 
                else {
                    const memoInput = document.getElementById('gimmick-memo'); const gimmickObj = { type: currentEditTool, memo: memoInput.value, isIdentified: false };
                    if (gimmickBinding === 'A') { if (block.type === 'empty' || block.type === 'wall') return; worldGimmickData[currentFloor][by*3 + vy][bx*3 + vx] = null; block.gimmicks[origIndex] = gimmickObj; } 
                    else { block.gimmicks[origIndex] = null; worldGimmickData[currentFloor][by*3 + vy][bx*3 + vx] = gimmickObj; }
                    memoInput.value = ''; 
                }
            }
            renderMap();
        } 
        else if (currentMode === 'play') {
            if (selectedBlockForMove !== null) {
                if (highlightedBlocks.some(pos => pos.x === bx && pos.y === by)) {
                    const srcX = selectedBlockForMove.x, srcY = selectedBlockForMove.y; const temp = mapData[currentFloor][by][bx];
                    mapData[currentFloor][by][bx] = mapData[currentFloor][srcY][srcX]; mapData[currentFloor][srcY][srcX] = temp;
                    if (playerPos && playerPos.z === currentFloor && Math.floor(playerPos.wx / 3) === srcX && Math.floor(playerPos.wy / 3) === srcY) { playerPos.wx += (bx - srcX) * 3; playerPos.wy += (by - srcY) * 3; }
                } 
                selectedBlockForMove = null; highlightedBlocks = []; renderMap(); return; 
            }

            if (playTool === 'movePlayer') { playerPos = { wx: bx * 3 + vx, wy: by * 3 + vy, z: currentFloor }; playerPositions[currentFloor] = playerPos; block.revealed = true; renderMap(); return; } 
            else if (playTool === 'fogToggle') { if (lanternMode) { alert('🏮 등불 모드가 켜져 있습니다!'); return; } block.revealed = !block.revealed; renderMap(); return; } 
            else if (playTool === 'identifyGimmick') {
                const wX = bx * 3 + vx, wY = by * 3 + vy; let toggled = false;
                if (block.gimmicks[origIndex]) { block.gimmicks[origIndex].isIdentified = !block.gimmicks[origIndex].isIdentified; toggled = true; }
                if (worldGimmickData[currentFloor][wY][wX]) { worldGimmickData[currentFloor][wY][wX].isIdentified = !worldGimmickData[currentFloor][wY][wX].isIdentified; toggled = true; }
                if (toggled) renderMap(); return;
            } 
            else if (playTool === 'solveGimmick') {
                const wX = bx * 3 + vx, wY = by * 3 + vy;
                if (block.gimmicks[origIndex] || worldGimmickData[currentFloor][wY][wX]) { if(confirm('이 기믹을 해결하여 해제(삭제)하시겠습니까?')) { block.gimmicks[origIndex] = null; worldGimmickData[currentFloor][wY][wX] = null; } } renderMap(); return;
            } 
            else if (playTool === 'rotate') {
                if (block.type !== 'empty' && block.type !== 'wall' && block.isRotatable) { block.rotation = (block.rotation + 90) % 360; if (playerPos && playerPos.z === currentFloor && Math.floor(playerPos.wx / 3) === bx && Math.floor(playerPos.wy / 3) === by) { const p_vx = playerPos.wx % 3, p_vy = playerPos.wy % 3; playerPos.wx = bx * 3 + (2 - p_vy); playerPos.wy = by * 3 + p_vx; } }
            } 
            else if (playTool === 'clueWarning') { if (clueSizeMode === 'block') block.blockClue = 'warning'; else worldClueData[currentFloor][by*3 + vy][bx*3 + vx] = 'warning'; } 
            else if (playTool === 'clueQuestion') { if (clueSizeMode === 'block') block.blockClue = 'question'; else worldClueData[currentFloor][by*3 + vy][bx*3 + vx] = 'question'; } 
            else if (playTool === 'clueClear') { if (clueSizeMode === 'block') block.blockClue = null; else worldClueData[currentFloor][by*3 + vy][bx*3 + vx] = null; } 
            else {
                const markerColor = document.getElementById('marker-color-select').value;
                if (playTool === 'markerA') { if (block.type === 'empty' || block.type === 'wall') return; block.markers[origIndex] = markerColor; } 
                else if (playTool === 'markerB') { worldMarkerData[currentFloor][by*3 + vy][bx*3 + vx] = markerColor; } 
                else if (playTool === 'markerClear') { block.markers[origIndex] = null; worldMarkerData[currentFloor][by*3 + vy][bx*3 + vx] = null; }
            }
            renderMap();
        }
    }

    function updatePlayerFacing() {
        const up = pressedKeys['ArrowUp'] || pressedKeys['KeyW'] || pressedKeys['w']; 
        const down = pressedKeys['ArrowDown'] || pressedKeys['KeyS'] || pressedKeys['s']; 
        const left = pressedKeys['ArrowLeft'] || pressedKeys['KeyA'] || pressedKeys['a']; 
        const right = pressedKeys['ArrowRight'] || pressedKeys['KeyD'] || pressedKeys['d'];
        let newFacing = playerFacing;
        if (up) newFacing = '위'; else if (down) newFacing = '아래'; else if (left) newFacing = '왼쪽'; else if (right) newFacing = '오른쪽';
        if (newFacing !== playerFacing) { playerFacing = newFacing; renderMap(); }
    }

    window.addEventListener('keyup', function(e) { pressedKeys[e.code] = false; pressedKeys[e.key] = false; updatePlayerFacing(); });
    containerEl.addEventListener('keydown', function(e) {
        if (currentMode !== 'play' || !playerPos) return; pressedKeys[e.code] = true; pressedKeys[e.key] = true; updatePlayerFacing();
        let dx = 0, dy = 0; if (e.code === 'ArrowUp' || e.code === 'KeyW') dy = -1; else if (e.code === 'ArrowDown' || e.code === 'KeyS') dy = 1; else if (e.code === 'ArrowLeft' || e.code === 'KeyA') dx = -1; else if (e.code === 'ArrowRight' || e.code === 'KeyD') dx = 1; else return;
        e.preventDefault(); movePlayer(dx, dy);
    }, false);

    function movePlayer(dx, dy) {
        const nwx = playerPos.wx + dx, nwy = playerPos.wy + dy; if (nwx < 0 || nwx >= GRID_SIZE * 3 || nwy < 0 || nwy >= GRID_SIZE * 3) return;
        const nbx = Math.floor(nwx / 3), nby = Math.floor(nwy / 3), vx = nwx % 3, vy = nwy % 3; const targetBlock = mapData[playerPos.z][nby][nbx];
        if (targetBlock.type === 'empty' || targetBlock.type === 'wall') return;
        const orig = getOriginalTileCoord(vx, vy, targetBlock.rotation); const origIndex = orig.y * 3 + orig.x;
        
        let isPassable = (blockTypes[targetBlock.type].tiles[origIndex] === 1 || targetBlock.type === 'dot');
        const tState = targetBlock.tileStates ? targetBlock.tileStates[origIndex] : 0;
        
        if (tState === 1) isPassable = false; 
        if (tState === 2 && globalWaterLevel === true) isPassable = false; 
        if (tState === 3 && globalWaterLevel === false) isPassable = false; 
        
        if (isPassable) { playerPos.wx = nwx; playerPos.wy = nwy; targetBlock.revealed = true; playerPositions[currentFloor] = playerPos; renderMap(); }
    }

    function updateClueTracker() {
        const listEl = document.getElementById('clue-tracker-list');
        listEl.innerHTML = '';
        let hasClues = false;
        const rowNames = ['A','B','C','D','E','F','G','H','I']; 

        for(let y=0; y<GRID_SIZE; y++) {
            for(let x=0; x<GRID_SIZE; x++) {
                const block = mapData[currentFloor][y][x];
                if(block.type === 'empty' || block.type === 'wall') continue;
                for(let i=0; i<9; i++) {
                    const vx = i%3, vy = Math.floor(i/3);
                    const orig = getOriginalTileCoord(vx, vy, block.rotation); const origIdx = orig.y*3 + orig.x;

                    const bg = block.gimmicks[origIdx];
                    if(bg && bg.isIdentified && bg.memo) { hasClues = true; listEl.innerHTML += `<li class="clue-item"><b>[${rowNames[y]}-${x+1}]</b> ${bg.memo}</li>`; }
                    const bm = block.markers[origIdx];
                    if(bm) { hasClues = true; listEl.innerHTML += `<li class="clue-item marker-item" style="border-left-color:${bm}"><b>[${rowNames[y]}-${x+1}] 🚩</b> 플레이어 표식</li>`; }
                }
            }
        }
        for (let wy = 0; wy < GRID_SIZE * 3; wy++) {
            for (let wx = 0; wx < GRID_SIZE * 3; wx++) {
                const bx = Math.floor(wx / 3); const by = Math.floor(wy / 3);
                const wg = worldGimmickData[currentFloor][wy][wx];
                if(wg && wg.isIdentified && wg.memo) { hasClues = true; listEl.innerHTML += `<li class="clue-item"><b>[${rowNames[by]}-${bx+1}]</b> ${wg.memo}</li>`; }
                const wm = worldMarkerData[currentFloor][wy][wx];
                if(wm) { hasClues = true; listEl.innerHTML += `<li class="clue-item marker-item" style="border-left-color:${wm}"><b>[${rowNames[by]}-${bx+1}] 🏁</b> 고정 표식</li>`; }
            }
        }
        if(!hasClues) { listEl.innerHTML = `<li style="color:#778da9; text-align:center; margin-top:30px; font-size:12px; line-height:1.6;">밝혀진 기믹 메모나<br>설치된 마커가 없습니다.</li>`; }
    }

    function renderMap() {
        const isPLViewActive = (isCapturingPL || gmFogPreview);

        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const blockData = mapData[currentFloor][y][x];
                const blockEl = document.getElementById(`block-${x}-${y}`);
                
                blockEl.querySelectorAll('.fog, .constraint-icon, .custom-block-bg').forEach(el => el.remove());
                blockEl.className = `block`;

                const hideFogCompletely = (currentMode === 'edit');
                let isBlockRevealed = (blockData.type === 'empty' || blockData.revealed);
                
                if (lanternMode && currentMode === 'play') {
                    if (playerPos && playerPos.z === currentFloor) {
                        const pbx = Math.floor(playerPos.wx / 3); const pby = Math.floor(playerPos.wy / 3);
                        isBlockRevealed = (Math.abs(x - pbx) <= 1 && Math.abs(y - pby) <= 1);
                    } else isBlockRevealed = false;
                }
                if (blockData.type === 'start') isBlockRevealed = true;

                const stripContents = (!hideFogCompletely && !isBlockRevealed && isPLViewActive);
                const blockHasCustomImg = !!customAssets.blocks[blockData.type]; 

                if (blockData.type === 'empty' || stripContents) { blockEl.classList.add('empty-block'); } 
                else {
                    if (blockData.type === 'wall') blockEl.classList.add('wall-block');
                    if (blockData.type === 'start') blockEl.classList.add('start-point');
                    if (blockData.type === 'goal') blockEl.classList.add('goal-point');
                }
                
                if (selectedBlockForMove && selectedBlockForMove.x === x && selectedBlockForMove.y === y) blockEl.classList.add('selected-block');
                if (highlightedBlocks.some(pos => pos.x === x && pos.y === y)) blockEl.classList.add('highlight');

                blockEl.style.transform = `rotate(0deg)`;

                if (blockHasCustomImg && !stripContents) {
                    const bgEl = document.createElement('div'); bgEl.className = 'custom-block-bg'; bgEl.style.position = 'absolute'; bgEl.style.inset = '0';
                    bgEl.style.backgroundImage = `url(${customAssets.blocks[blockData.type]})`; bgEl.style.backgroundSize = 'cover'; bgEl.style.transform = `rotate(${blockData.rotation}deg)`; bgEl.style.zIndex = '0'; bgEl.style.borderRadius = '2px';
                    bgEl.style.pointerEvents = 'none'; 
                    blockEl.appendChild(bgEl);
                }

                const tilesLayout = blockTypes[blockData.type].tiles;
                const tileNodes = blockEl.querySelectorAll('.tile');

                for (let i = 0; i < 9; i++) {
                    const vx = i % 3; const vy = Math.floor(i / 3);
                    const orig = getOriginalTileCoord(vx, vy, blockData.rotation); const origIndex = orig.y * 3 + orig.x;
                    const tileEl = tileNodes[i];
                    
                    if (stripContents) { tileEl.className = 'tile'; } 
                    else {
                        tileEl.className = `tile ${tilesLayout[origIndex] && blockData.type !== 'wall' ? 'path' : ''}`;
                        if (blockHasCustomImg) { tileEl.style.backgroundColor = 'transparent'; tileEl.style.boxShadow = 'none'; } else { tileEl.style.backgroundColor = ''; tileEl.style.boxShadow = ''; }
                        
                        let tState = blockData.tileStates ? blockData.tileStates[origIndex] : 0;
                        if (tState === 1) tileEl.classList.add('tile-wall');
                        else if (tState === 2) tileEl.classList.add(globalWaterLevel ? 'tile-water-high' : 'tile-water-low');
                        else if (tState === 3) tileEl.classList.add(globalWaterLevel ? 'tile-plat-high' : 'tile-plat-low');
                    }
                    
                    tileEl.innerHTML = ''; delete tileEl.dataset.memo; 

                    if (!stripContents) {
                        if (blockData.gimmicks && blockData.gimmicks[origIndex]) {
                            const gData = blockData.gimmicks[origIndex]; const vis = gimmickVisuals[gData.type];
                            if (!isPLViewActive) {
                                tileEl.classList.add('gimmick-a');
                                const eyeIcon = gData.isIdentified ? `<span style="position:absolute; top:-2px; left:-2px; font-size:10px; z-index:20;">👁️</span>` : '';
                                tileEl.innerHTML += `${eyeIcon}<span class="symbol-icon ${vis.class}" style="pointer-events:none;">${vis.icon}</span>`;
                                if(gData.memo) tileEl.dataset.memo = gData.memo; 
                            } 
                            else if (gData.isIdentified) {
                                tileEl.classList.add('gimmick-a'); tileEl.innerHTML += `<span class="symbol-icon ${vis.class}" style="pointer-events:none;">${vis.icon}</span>`;
                            }
                            else if (gimmickBlindMode) {
                                tileEl.classList.add('gimmick-a');
                                if (!isCapturingPL && gmFogPreview) { tileEl.innerHTML += `<span class="symbol-icon" style="pointer-events:none; color:#fdf0d5; text-shadow:0 0 5px #000; font-size:18px;">❓<span style="position:absolute; bottom:0px; right:0px; font-size:10px; opacity:0.9; text-shadow:none;" class="${vis.class}">${vis.icon}</span></span>`; if(gData.memo) { tileEl.style.pointerEvents = 'auto'; tileEl.dataset.memo = gData.memo; } } 
                                else { tileEl.innerHTML += `<span class="symbol-icon" style="pointer-events:none; color:#fdf0d5; text-shadow:0 0 5px #000; font-size:18px;">❓</span>`; }
                            }
                        }
                    }

                    if (blockData.markers && blockData.markers[origIndex]) {
                        const mColor = blockData.markers[origIndex]; tileEl.innerHTML += `<div style="position:absolute; z-index:105; pointer-events:none;">${getFlagSVG(mColor, false)}</div>`;
                    }
                }

                if (blockData.type !== 'empty' && blockData.type !== 'wall' && !stripContents) {
                    if (!blockData.isMovable) { const iconMove = document.createElement('div'); iconMove.className = 'constraint-icon no-move'; iconMove.innerText = '이동X'; blockEl.appendChild(iconMove); }
                    if (!blockData.isRotatable) { const iconRot = document.createElement('div'); iconRot.className = 'constraint-icon no-rot'; iconRot.innerText = '회전X'; blockEl.appendChild(iconRot); }
                }

                if (!hideFogCompletely && !isBlockRevealed) { const fogEl = document.createElement('div'); fogEl.className = 'fog'; blockEl.appendChild(fogEl); }
            }
        }

        overlayEl.innerHTML = ''; clueOverlayEl.innerHTML = ''; 
        
        if (currentMode === 'edit' && playerSpawns[currentFloor]) {
            const spawn = playerSpawns[currentFloor];
            const bx = Math.floor(spawn.wx / 3), vx = spawn.wx % 3, by = Math.floor(spawn.wy / 3), vy = spawn.wy % 3;
            const ghostEl = document.createElement('div'); ghostEl.className = 'overlay-item player-marker';
            
            // 🌟 바뀐 타일 및 블럭 크기에 맞춘 위치 연산 (62px 블럭, 4px 간격, 20px 타일)
            ghostEl.style.left = `${bx * 66 + 1 + vx * 20}px`; ghostEl.style.top = `${by * 66 + 1 + vy * 20}px`;  ghostEl.style.opacity = '0.5'; 
            let pIcon = `<div style="z-index:2; opacity:0.8;">${getPlayerMarkerSVG()}</div>`;
            if(customAssets.player['아래']) pIcon = `<img src="${customAssets.player['아래']}" style="width:28px; height:28px; z-index:2; opacity:0.8; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8)); image-rendering:pixelated; position:relative; top:-4px;" />`;
            ghostEl.innerHTML = pIcon; overlayEl.appendChild(ghostEl);
        }

        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const blockData = mapData[currentFloor][y][x];
                if (blockData.blockClue) {
                    const clueEl = document.createElement('div'); clueEl.className = 'overlay-item';
                    clueEl.style.left = `${x * 66}px`; clueEl.style.top = `${y * 66}px`;  clueEl.style.width = '62px'; clueEl.style.height = '62px';
                    clueEl.style.fontSize = '35px'; clueEl.style.textShadow = '0 0 10px rgba(0,0,0,1)';
                    clueEl.innerHTML = blockData.blockClue === 'warning' ? '⚠️' : '❓'; clueOverlayEl.appendChild(clueEl);
                }
            }
        }

        for (let wy = 0; wy < GRID_SIZE * 3; wy++) {
            for (let wx = 0; wx < GRID_SIZE * 3; wx++) {
                const bx = Math.floor(wx / 3), vx = wx % 3; const by = Math.floor(wy / 3), vy = wy % 3; const blockUnder = mapData[currentFloor][by][bx];
                const wClue = worldClueData[currentFloor][wy][wx];
                if (wClue) { const clueEl = document.createElement('div'); clueEl.className = 'overlay-item'; clueEl.style.left = `${bx * 66 + 1 + vx * 20}px`; clueEl.style.top = `${by * 66 + 1 + vy * 20}px`; clueEl.style.fontSize = '18px'; clueEl.style.textShadow = '0 0 5px rgba(0,0,0,1)'; clueEl.innerHTML = wClue === 'warning' ? '⚠️' : '❓'; clueOverlayEl.appendChild(clueEl); }

                let isOverlayBlockRevealed = (blockUnder.type === 'empty' || blockUnder.revealed);
                if (lanternMode && currentMode === 'play') { if (playerPos && playerPos.z === currentFloor) { const pbx = Math.floor(playerPos.wx / 3); const pby = Math.floor(playerPos.wy / 3); isOverlayBlockRevealed = (Math.abs(bx - pbx) <= 1 && Math.abs(by - pby) <= 1); } else isOverlayBlockRevealed = false; }
                if (blockUnder.type === 'start') isOverlayBlockRevealed = true;

                const shouldHideItem = !isOverlayBlockRevealed && isPLViewActive;
                const wGimmick = worldGimmickData[currentFloor][wy][wx]; const wMarker = worldMarkerData[currentFloor][wy][wx];
                const renderWGimmickGM = wGimmick && !isPLViewActive; const renderWGimmickPLIdentified = wGimmick && isPLViewActive && wGimmick.isIdentified && !shouldHideItem; const renderWGimmickPLBlind = wGimmick && isPLViewActive && !wGimmick.isIdentified && gimmickBlindMode && !shouldHideItem;
                
                if (renderWGimmickGM || renderWGimmickPLIdentified || renderWGimmickPLBlind || wMarker) {
                    const itemEl = document.createElement('div'); itemEl.className = 'overlay-item'; itemEl.style.left = `${bx * 66 + 1 + vx * 20}px`; itemEl.style.top = `${by * 66 + 1 + vy * 20}px`;
                    itemEl.addEventListener('click', (e) => { e.stopPropagation(); handleTileClick(bx, by, vy * 3 + vx); }); itemEl.addEventListener('contextmenu', (e) => { e.preventDefault(); if (currentMode === 'play') handleRightClickBlockMove(bx, by); });

                    if (renderWGimmickGM) { 
                        const vis = gimmickVisuals[wGimmick.type]; itemEl.classList.add('gimmick-b'); const eyeIcon = wGimmick.isIdentified ? `<span style="position:absolute; top:-2px; left:-2px; font-size:10px; z-index:20;">👁️</span>` : '';
                        itemEl.innerHTML += `${eyeIcon}<span class="symbol-icon ${vis.class}" style="pointer-events:none;">${vis.icon}</span>`; 
                        if(wGimmick.memo) { itemEl.style.pointerEvents = 'auto'; itemEl.dataset.memo = wGimmick.memo; }
                    } else if (renderWGimmickPLIdentified) {
                        const vis = gimmickVisuals[wGimmick.type]; itemEl.classList.add('gimmick-b'); itemEl.innerHTML += `<span class="symbol-icon ${vis.class}" style="pointer-events:none;">${vis.icon}</span>`; 
                    } else if (renderWGimmickPLBlind) {
                        const vis = gimmickVisuals[wGimmick.type]; itemEl.classList.add('gimmick-b'); 
                        if (!isCapturingPL && gmFogPreview) { itemEl.innerHTML += `<span class="symbol-icon" style="pointer-events:none; color:#fdf0d5; text-shadow:0 0 5px #000; font-size:18px;">❓<span style="position:absolute; bottom:0px; right:0px; font-size:10px; opacity:0.9; text-shadow:none;" class="${vis.class}">${vis.icon}</span></span>`; if(wGimmick.memo) { itemEl.style.pointerEvents = 'auto'; itemEl.dataset.memo = wGimmick.memo; } } 
                        else { itemEl.innerHTML += `<span class="symbol-icon" style="pointer-events:none; color:#fdf0d5; text-shadow:0 0 5px #000; font-size:18px;">❓</span>`; }
                    }

                    if (wMarker) { itemEl.innerHTML += `<div style="position:absolute; z-index:105; pointer-events:none;">${getFlagSVG(wMarker, true)}</div>`; }
                    overlayEl.appendChild(itemEl);
                }
            }
        }

        if (currentMode === 'play' && playerPos && playerPos.z === currentFloor) {
            const bx = Math.floor(playerPos.wx / 3), vx = playerPos.wx % 3, by = Math.floor(playerPos.wy / 3), vy = playerPos.wy % 3; const blockUnder = mapData[currentFloor][by][bx];
            let isPlayerBlockRevealed = (blockUnder.type === 'empty' || blockUnder.revealed);
            if (lanternMode && currentMode === 'play') isPlayerBlockRevealed = true; 
            const shouldHidePlayer = !isPlayerBlockRevealed && isPLViewActive;
            
            if (!shouldHidePlayer) {
                const playerEl = document.createElement('div'); playerEl.className = 'overlay-item player-marker';
                playerEl.style.left = `${bx * 66 + 1 + vx * 20}px`; playerEl.style.top = `${by * 66 + 1 + vy * 20}px`;  
                let playerHtml = `<div style="z-index:2;">${getPlayerMarkerSVG()}</div>`;
                if (customAssets.player[playerFacing]) { playerHtml = `<img src="${customAssets.player[playerFacing]}" style="width: 28px; height: 28px; z-index: 2; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8)); image-rendering: pixelated; position: relative; top: -4px;" />`; }
                playerEl.innerHTML = playerHtml; overlayEl.appendChild(playerEl);
            }
        }
        updateClueTracker();
    }
    initBoard();
</script>
</body>
</html>
